[package]
name = "rotator-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.95"
base64 = "0.22.1"
chrono = "0.4.40"
percent-encoding = "2.3.1"
reqwest = "0.13.4"
serde = { version = "1.0.217", features = ["derive"] }
serde_yaml = "0.9.34"
shadowsocks = { version = "1.24.0", default-features = false, features = ["aead-cipher", "stream-cipher"] }
thiserror = "2.0.11"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.1.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"

[dev-dependencies]
tempfile = "3.14.0"
